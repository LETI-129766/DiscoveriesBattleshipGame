name: Notify pull request reviewer

on:
  pull_request:
    types: [review_requested]

permissions:
  pull-requests: write

jobs:
  notify-reviewer:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on the pull request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reviewer = context.payload.requested_reviewer?.login;

            if (!reviewer) {
              core.info("No individual reviewer was specified.");
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `Olá @${reviewer}. Este pull request está pronto para revisão. Quando tiver disponibilidade, agradeço que reveja as alterações e partilhe os seus comentários.`
            });
